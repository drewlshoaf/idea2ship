<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f7ff">
  <meta name="description" content="idea2ship is an agentic product studio that turns promising ideas into implementation-ready plans.">
  <title>idea2ship — From ideas to impact</title>
  <link rel="icon" type="image/svg+xml" href="./favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <a class="brand" href="#" data-view="dashboard" aria-label="idea2ship dashboard">
        <span class="brand-rocket">🚀</span>
        <span class="brand-word">idea<span>2</span>ship</span>
      </a>
      <nav class="primary-nav" aria-label="Main navigation">
        <button class="nav-item active" data-view="dashboard"><span class="nav-icon">⌂</span>Dashboard</button>
        <button class="nav-item new-project"><span class="nav-icon">＋</span>New Project</button>
        <button class="nav-item" data-view="workspace"><span class="nav-icon">▣</span>Projects</button>
        <button class="nav-item" data-view="artifacts"><span class="nav-icon">▧</span>Artifacts</button>
        <button class="nav-item" data-view="architecture"><span class="nav-icon">◇</span>Architecture</button>
        <button class="nav-item" data-view="backlog"><span class="nav-icon">☷</span>Backlog</button>
        <button class="nav-item" data-view="agents"><span class="nav-icon">✣</span>Agents &amp; Tools</button>
        <button class="nav-item" data-view="templates"><span class="nav-icon">◫</span>Templates</button>
        <button class="nav-item setup-button"><span class="nav-icon">⚙</span>Settings</button>
      </nav>
      <div class="sidebar-bottom">
        <section class="upgrade-card">
          <div class="upgrade-spark">✦</div>
          <strong>Build something amazing.</strong>
          <p>More agents. Clearer plans. Faster shipping.</p>
          <button class="text-button" type="button">Explore Pro <span>→</span></button>
        </section>
        <p class="sidebar-signoff">From ideas to impact.</p>
      </div>
    </aside>

    <div class="page-frame">
      <header class="topbar">
        <label class="search-box">
          <span>⌕</span>
          <input type="search" placeholder="Search projects, agents, artifacts..." aria-label="Search">
          <kbd>⌘ K</kbd>
        </label>
        <div class="top-actions">
          <button class="primary-button top-new new-project" type="button"><span>＋</span> New Project</button>
          <button class="notification-button" type="button" aria-label="Notifications">♧<i></i></button>
          <button class="profile-button" type="button"><span class="avatar">DS</span><span><strong>Andrew Shoaf</strong><small>Founder</small></span><b>⌄</b></button>
        </div>
      </header>
      <main id="app" class="main-content" tabindex="-1"></main>
    </div>
  </div>
  <script src="./app.js"></script>
</body>
</html>
